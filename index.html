<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MicroFinCo ISO 27001 Compliance Dashboard</title>
  <!-- Chart.js loaded from a CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: Arial, sans-serif; max-width: 900px; margin: 20px auto; padding: 0 16px; color: #222; }
    h1 { text-align: center; }
    .card { border: 1px solid #ddd; border-radius: 8px; padding: 16px; margin-bottom: 24px; }
    .grid { display: grid; grid-template-columns: 40px repeat(5, 1fr); gap: 4px; }
    .cell { min-height: 60px; display: flex; align-items: center; justify-content: center;
            font-size: 11px; text-align: center; border-radius: 4px; color: #000; padding: 2px; }
    .label { display: flex; align-items: center; justify-content: center; font-weight: bold; }
    .note { font-size: 13px; color: #555; }
    #error { color: #b00020; }
  </style>
</head>
<body>
  <h1>MicroFinCo ISO 27001 Compliance Dashboard</h1>
  <p id="error"></p>

  <div class="card">
    <h2>Control Status (Gap Analysis)</h2>
    <canvas id="statusChart"></canvas>
  </div>

  <div class="card">
    <h2>Risk Heat Map (Impact x Likelihood)</h2>
    <div id="heatmap" class="grid"></div>
    <p class="note">Rows: likelihood (5 = top). Columns: impact (1 to 5). Cells show risk IDs. Green = low score, red = high score.</p>
  </div>

<script>
// ---- Data sources (raw CSV files on GitHub) ----
const GAP_URL  = "https://raw.githubusercontent.com/aleezakhannn/ISO27001-gap-analysis/main/iso27001_gap_analysis.csv";
const RISK_URL = "https://raw.githubusercontent.com/aleezakhannn/Microfinco-risk-resgister/main/risk_register.csv";

// ---- Minimal CSV parser (handles quoted fields) ----
function parseCSV(text) {
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"' && text[i + 1] === '"') { field += '"'; i++; }
      else if (c === '"') inQuotes = false;
      else field += c;
    } else if (c === '"') inQuotes = true;
    else if (c === ",") { row.push(field); field = ""; }
    else if (c === "\n" || c === "\r") {
      if (c === "\r" && text[i + 1] === "\n") i++;
      row.push(field); field = "";
      if (row.length > 1 || row[0] !== "") rows.push(row);
      row = [];
    } else field += c;
  }
  if (field !== "" || row.length) { row.push(field); rows.push(row); }
  // Convert to array of objects using the header row
  const header = rows.shift().map(h => h.trim());
  return rows.map(r => Object.fromEntries(header.map((h, i) => [h, (r[i] || "").trim()])));
}

// ---- Fetch a CSV fresh each time so the charts follow file changes ----
async function loadCSV(url) {
  const res = await fetch(url, { cache: "no-store" });
  if (!res.ok) throw new Error("Could not load " + url + " (" + res.status + ")");
  return parseCSV(await res.text());
}

// ---- Bar chart: count of Implemented / Partial / Not ----
function drawStatusChart(controls) {
  const counts = { Implemented: 0, Partial: 0, Not: 0 };
  controls.forEach(c => { if (c.Status in counts) counts[c.Status]++; });
  new Chart(document.getElementById("statusChart"), {
    type: "bar",
    data: {
      labels: Object.keys(counts),
      datasets: [{ label: "Number of controls", data: Object.values(counts), backgroundColor: "#1f77b4" }]
    },
    options: { scales: { y: { beginAtZero: true, ticks: { precision: 0 } } } }
  });
}

// ---- Heat map: 5x5 grid, colour by score (green to red) ----
function drawHeatmap(risks) {
  const el = document.getElementById("heatmap");
  el.innerHTML = "";
  // Group risk IDs by "impact-likelihood"
  const cells = {};
  risks.forEach(r => {
    const key = r.Impact + "-" + r.Likelihood;
    (cells[key] = cells[key] || []).push(r["Risk ID"]);
  });
  // Rows: likelihood 5 down to 1
  for (let l = 5; l >= 1; l--) {
    const label = document.createElement("div");
    label.className = "label"; label.textContent = "L" + l;
    el.appendChild(label);
    for (let i = 1; i <= 5; i++) {
      const score = i * l;
      const cell = document.createElement("div");
      cell.className = "cell";
      // Hue 120 = green (score 1), hue 0 = red (score 25)
      cell.style.background = "hsl(" + (120 - (score - 1) / 24 * 120) + ", 70%, 55%)";
      cell.title = "Impact " + i + " x Likelihood " + l + " = " + score;
      cell.textContent = (cells[i + "-" + l] || []).join(", ");
      el.appendChild(cell);
    }
  }
  // Bottom row: impact labels
  el.appendChild(document.createElement("div"));
  for (let i = 1; i <= 5; i++) {
    const label = document.createElement("div");
    label.className = "label"; label.textContent = "I" + i;
    el.appendChild(label);
  }
}

// ---- Run ----
Promise.all([loadCSV(GAP_URL), loadCSV(RISK_URL)])
  .then(([controls, risks]) => { drawStatusChart(controls); drawHeatmap(risks); })
  .catch(err => { document.getElementById("error").textContent = "Error: " + err.message; });
</script>
</body>
</html>
